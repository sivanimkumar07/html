<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="login.html">
        <label for="fname">Fullname</label><br>
        <input type="text" id="fname" name="fname" maxlength="10" placeholder="enter username" required><br>
        <label for="email">Email Address</label><br>
        <input type="text" id="email" name="email" placeholder="example@gmail.com"><br>
        <label for="phone number">Phone number</label><br>
        <input type="Phone number" maxlength="10" placeholder="enter number"><br>
        <label for="subject">Enter your subject</label><br>
        <input type="subject" pattern="[A-Z-a-z]{10,}" title="at least 10 alphanumeric characters" required></input><br>
        <label for="message">Send any message</label><br>
        
        <p> &copy; contact us</p>
    </form> 
</body>
</html>
